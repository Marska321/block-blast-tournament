<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#18313a" />
    <meta name="description" content="Blok Blaster by Playables. Place blocks, clear lines and beat your best. Free in your browser, with no download or forced ad breaks." />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Blok Blaster · by Playables</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/brand.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="hud-overlay">
        <div class="game-brand-bar">
          <button id="landing-info-btn" class="game-brand" aria-label="Game Info & Tournament Guide" title="Game info">
            <img src="/brand-mark.svg" alt="" width="34" height="34" />
            <span><strong>blok blaster<span class="brand-dot">.</span></strong><small>by Playables</small></span>
          </button>
          <button id="updates-btn" class="hud-btn" aria-label="Announcements and notifications" title="Announcements and notifications"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Z"/><path d="M10 21h4M12 2V1"/></svg></button>
          <button id="leaderboard-btn" class="hud-btn lb-gold-btn" aria-label="Open Leaderboard" title="Leaderboard"><span aria-hidden="true">▥</span></button>
        </div>
        <!-- Top row: Score + Tournament badge + Mute -->
        <div class="hud-top-row">
          <div class="hud-center-score-box" id="hud-score-box">
            <div class="hud-best-row">
              <span class="crown-icon">BEST</span>
              <span id="hud-best-value" class="hud-best-val">0</span>
            </div>
            <span id="hud-score-value" class="hud-score-val">0</span>
            <span id="hud-stakes-tag" class="hud-stakes-tag"></span>
          </div>

          <div class="hud-controls">
            <span id="hud-chances-badge" class="chances-pill active">⚡ 3 LEFT TODAY</span>
            <button id="wallpaper-btn" class="hud-btn" aria-label="Change Wallpaper & Themes" title="Change Wallpaper & Themes">🎨</button>
            <button id="theme-btn" class="hud-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">☀️</button>
            <button id="mute-btn" class="hud-btn" aria-label="Toggle Mute">🔊</button>
          </div>
        </div>

        <!-- Mode selector bar: 3-way navigation -->
        <div class="hud-mode-selector">
          <button id="mode-levels-btn" class="mode-tab active">
            🗺️ Levels
          </button>
          <button id="mode-classic-btn" class="mode-tab">
            🎯 Classic
          </button>
          <button id="mode-tourney-btn" class="mode-tab tourney-tab">
            🏆 Tournament
          </button>
        </div>

        <!-- Tournament Live Status Bar (active during Classic & Blitz play) -->
        <div id="tournament-banner" class="tournament-live-bar" style="display: none;">
          <div class="tourney-bar-left">
            <span class="tourney-live-dot"></span>
            <span id="tourney-banner-title" class="tourney-bar-title">🏆 OFFICIAL PRIZE RUN</span>
          </div>
          <div class="tourney-bar-right">
            <span id="tourney-banner-subtitle" class="tourney-bar-sub">Provisional standings</span>
          </div>
        </div>

        <!-- Level Mode HUD (active during level play) -->
        <div id="level-hud" class="level-hud-bar" style="display: none;">
          <div class="level-hud-left">
            <button id="level-map-shortcut-btn" class="level-hud-pill">
              <span id="level-hud-badge">LEVEL 1</span>
              <span class="map-icon-hint">🗺️</span>
            </button>
            <span id="level-hud-world" class="level-hud-subtext">Ocean Depths</span>
          </div>
          <div id="level-hud-goals" class="level-hud-goals"></div>
          <div id="level-hud-moves" class="level-hud-moves" style="display: none;">
            <span id="level-moves-value">20</span>
            <span class="moves-label">MOVES</span>
          </div>
          <button id="level-restart-btn" class="level-restart-pill" title="Restart Level" aria-label="Restart Level">🔄</button>
        </div>

        <!-- Combo Bar -->
        <div id="combo-bar-container">
          <div id="combo-fill"></div>
          <span id="combo-label">COMBO 0</span>
        </div>
      </div>

      <canvas id="gameCanvas" tabindex="0" aria-label="Block puzzle. Choose piece 1, 2 or 3, move with arrow keys, and press Enter to place. Alternative grid controls are below."></canvas>
      <details id="keyboard-controls" class="keyboard-controls">
        <summary>Keyboard &amp; accessible board controls</summary>
        <p>Choose piece 1–3, use arrow keys on the game or board, then Enter to place. A1 is the top-left cell.</p>
        <div id="accessible-pieces"></div>
        <div id="accessible-board" role="grid" aria-label="Puzzle board, eight rows and eight columns"></div>
        <button id="end-run-btn" type="button">Finish this run</button>
      </details>
      <p id="game-announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    </div>

    <script type="module" src="./src/script.ts"></script>
  </body>
</html>

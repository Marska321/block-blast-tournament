<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080911" />
    <title>Block Blast Tournament</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="hud-overlay">
        <!-- Top row: Score + Tournament badge + Mute -->
        <div class="hud-top-row">
          <div class="hud-left-action">
            <button id="leaderboard-btn" class="hud-btn lb-gold-btn" aria-label="Open Leaderboard">🏆</button>
          </div>

          <div class="hud-center-score-box" id="hud-score-box">
            <div class="hud-best-row">
              <span class="crown-icon">👑</span>
              <span id="hud-best-value" class="hud-best-val">0</span>
            </div>
            <span id="hud-score-value" class="hud-score-val">0</span>
            <span id="hud-stakes-tag" class="hud-stakes-tag"></span>
          </div>

          <div class="hud-controls">
            <span id="hud-chances-badge" class="chances-pill active">⚡ 3 LEFT TODAY</span>
            <button id="wallpaper-btn" class="hud-btn" aria-label="Change Wallpaper & Themes" title="Change Wallpaper & Themes">🎨</button>
            <button id="theme-btn" class="hud-btn" aria-label="Toggle Theme" title="Toggle Light/Dark Theme">☀️</button>
            <button id="mute-btn" class="hud-btn" aria-label="Toggle Mute">🔊</button>
          </div>
        </div>

        <!-- Mode selector bar: 3-way navigation -->
        <div class="hud-mode-selector">
          <button id="mode-levels-btn" class="mode-tab active">
            🗺️ Levels
          </button>
          <button id="mode-classic-btn" class="mode-tab">
            🎯 Classic
          </button>
          <button id="mode-blitz-btn" class="mode-tab">
            ⚡ Blitz
          </button>
        </div>

        <!-- Tournament Live Status Bar (active during Classic & Blitz play) -->
        <div id="tournament-banner" class="tournament-live-bar" style="display: none;">
          <div class="tourney-bar-left">
            <span class="tourney-live-dot"></span>
            <span id="tourney-banner-title" class="tourney-bar-title">🏆 OFFICIAL PRIZE RUN</span>
          </div>
          <div class="tourney-bar-right">
            <span id="tourney-banner-subtitle" class="tourney-bar-sub">Top 10 Cash Eligible</span>
          </div>
        </div>

        <!-- Level Mode HUD (active during level play) -->
        <div id="level-hud" class="level-hud-bar" style="display: none;">
          <div class="level-hud-left">
            <button id="level-map-shortcut-btn" class="level-hud-pill">
              <span id="level-hud-badge">LEVEL 1</span>
              <span class="map-icon-hint">🗺️</span>
            </button>
            <span id="level-hud-world" class="level-hud-subtext">Ocean Depths</span>
          </div>
          <div id="level-hud-goals" class="level-hud-goals"></div>
          <div id="level-hud-moves" class="level-hud-moves" style="display: none;">
            <span id="level-moves-value">20</span>
            <span class="moves-label">MOVES</span>
          </div>
          <button id="level-restart-btn" class="level-restart-pill" title="Restart Level" aria-label="Restart Level">🔄</button>
        </div>

        <!-- Combo Bar -->
        <div id="combo-bar-container">
          <div id="combo-fill"></div>
          <span id="combo-label">COMBO 0</span>
        </div>
      </div>

      <canvas id="gameCanvas"></canvas>
    </div>

    <script type="module" src="./src/script.ts"></script>
  </body>
</html>
